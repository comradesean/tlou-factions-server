    Author: "tlou_factions"
    Notes: "TESTING patch: lowers the find-match lobby start minimum from the shipped 6 to 2 so two-client dev testing can start a matchmade game. Replaces the bl to the playlist min-players getter (FUN_0039f1e0, sole call site binary-wide) with li r3,2 at the SERVER_LOBBY start gate; the shipped playlist records (dc1/net.bin *playlists*) carry min=6 for Supply Raid/deathmatch and Survivors/elimination. No downstream min checks exist (cfg+0x54==0 routes straight to the vote screen). Not for the final product. Original bytes at 0x003b7ab8: 4b fe 77 29."

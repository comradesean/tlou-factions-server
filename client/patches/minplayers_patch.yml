# =============================================================================
# PATCH 1.11 (app version 01.11). Same fix, ported by signature 2026-08-19.
#
# HOW THE ADDRESS WAS FOUND (not guessed): the 1.00 site 0x003b7ab8 sits in a
# distinctive sequence - two consecutive bl, then
#   lwz r31,-32712(r30) / mr r29,r3 / mr r3,r31 / bl <getter> / nop /
#   cmplw cr7,r29,r3 / bge cr7
# i.e. r29 = the P2P-gated counted-member total, r3 = the playlist minimum.
# That signature (with the bl wildcarded) matches 5 sites in EACH binary, and
# 1.11's third one is byte-for-byte identical to 1.00's third, down to the same
# lwz displacements (-32704/-32712/-32632), the same lwz r0,100(r9), and the
# same branch offsets (+0x1c/+0x8c/+0x88). Only the bl targets are relocated.
#
# CONFIRMED by the property the 1.00 patch relies on: the getter it calls has
# exactly ONE call site binary-wide. Scanning every bl in both binaries:
#   1.00  getter 0x0039f1e0  <- called only from 0x003b7ab8
#   1.11  getter 0x003b84ac  <- called only from 0x003d1d18
# Reproducing the documented 1.00 result validates the method.
#
# Original bytes at 0x003d1d18: 4b fe 67 95  (bl 0x3b84ac).
# =============================================================================
